<style>
  :root {
    --brown: #4a3728;
    --tan: #d9c7a8;
    --tan-light: #f3ecdd;
    --green: #4f7942;
    --green-dark: #3c5c32;
    --red: #a83232;
    --ink: #2b241c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--tan-light);
    color: var(--ink);
  }
  header {
    background: var(--brown);
    color: var(--tan-light);
    padding: 20px 24px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
  }
  header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--tan);
  }
  main {
    max-width: 620px;
    margin: 0 auto;
    padding: 24px;
  }
  .card {
    background: #fff;
    border: 1px solid #e4d8c0;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--brown);
    margin-bottom: 6px;
  }
  select, input[type=number] {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    border: 1px solid #cbb894;
    border-radius: 6px;
    background: #fff;
    color: var(--ink);
    margin-bottom: 16px;
  }
  select:focus, input:focus { outline: 2px solid var(--green); }
  .field-row { display: flex; gap: 12px; }
  .field-row > div { flex: 1; }
  button {
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary { background: var(--green); color: #fff; }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-primary:disabled { background: #b8c9b0; cursor: not-allowed; }
  .btn-file {
    background: var(--green);
    color: #fff;
    font-size: 17px;
    padding: 16px 20px;
  }
  .btn-file:hover { background: var(--green-dark); }
  .btn-file:disabled { background: #b8c9b0; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--brown);
    border: 1px solid #cbb894;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee2cc; }
  th { color: var(--brown); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  td.amount { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  .summary-line { font-size: 14px; margin: 0 0 14px; color: #55493a; }
  .warn {
    background: #fbeee0;
    border: 1px solid #e0b579;
    color: #7a4c12;
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .error {
    background: #f8e2e2;
    border: 1px solid #d99;
    color: var(--red);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .success {
    background: #e6f0e0;
    border: 1px solid #9cc08c;
    color: var(--green-dark);
    padding: 14px;
    border-radius: 6px;
    font-size: 15px;
    text-align: center;
  }
  .empty {
    text-align: center;
    color: #8a7d66;
    padding: 24px 0;
    font-size: 14px;
  }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #step2, #step3 { display: none; }
  [hidden] { display: none !important; }
</style>

<header>
  <h1>Delinquency Filing</h1>
  <p>Green Property Mgt — Demand for Possession (DC 100a)</p>
</header>

<main>
  <div class="card" id="step1">
    <label for="pmSelect">Requested by</label>
    <select id="pmSelect"><option value="">Loading PMs…</option></select>

    <label for="thresholdInput">Filing threshold ($ owed and above)</label>
    <input type="number" id="thresholdInput" value="100" min="0" step="1">

    <button class="btn-primary" id="previewBtn" onclick="loadPreview()">Preview Filing</button>
    <div id="previewError"></div>
  </div>

  <div class="card" id="step2">
    <div id="previewWarnings"></div>
    <p class="summary-line" id="previewSummary"></p>
    <div id="previewTableWrap"></div>
  </div>

  <div class="card" id="step3">
    <p class="summary-line">
      Confirm the names, addresses, and amounts above are correct. This will
      generate and send official DC 100a demand notices to each PM.
    </p>
    <button class="btn-file" id="fileBtn" onclick="fileNow()">Let's File</button>
    <button class="btn-secondary" style="margin-top:10px" onclick="resetForm()">Start over</button>
    <div id="fileError"></div>
    <div id="fileResult"></div>
  </div>
</main>

<script>
  var currentToken = null;

  google.script.run.withSuccessHandler(function(names) {
    var sel = document.getElementById('pmSelect');
    sel.innerHTML = '<option value="">Select…</option>' +
      names.map(function(n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
  }).withFailureHandler(function(err) {
    document.getElementById('pmSelect').innerHTML = '<option value="">Failed to load</option>';
  }).webGetPmList();

  function loadPreview() {
    var pm = document.getElementById('pmSelect').value;
    var threshold = document.getElementById('thresholdInput').value;
    var errEl = document.getElementById('previewError');
    errEl.innerHTML = '';

    if (!pm) { errEl.innerHTML = '<div class="error">Select who is requesting this filing.</div>'; return; }
    if (threshold === '' || Number(threshold) < 0) { errEl.innerHTML = '<div class="error">Enter a valid threshold.</div>'; return; }

    var btn = document.getElementById('previewBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Fetching latest report…';

    google.script.run
      .withSuccessHandler(function(result) { btn.disabled = false; btn.textContent = 'Preview Filing'; showPreview(result); })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = 'Preview Filing';
        errEl.innerHTML = '<div class="error">' + (err.message || err) + '</div>';
      })
      .webPreview(threshold, pm);
  }

  function showPreview(result) {
    currentToken = result.token;
    document.getElementById('step2').style.display = 'block';
    document.getElementById('step3').style.display = 'block';

    var warnEl = document.getElementById('previewWarnings');
    warnEl.innerHTML = '';
    if (result.missingLabels && result.missingLabels.length) {
      warnEl.innerHTML += '<div class="warn">⚠️ No report found yet for: ' + result.missingLabels.join(', ') + '. Those properties will not be included.</div>';
    }
    if (result.flaggedCount > 0) {
      warnEl.innerHTML += '<div class="warn">⚠️ ' + result.flaggedCount + ' delinquent row(s) could not be matched to a property and will be skipped — admin has been notified separately.</div>';
    }

    var summaryEl = document.getElementById('previewSummary');
    var tableWrap = document.getElementById('previewTableWrap');
    var fileBtn = document.getElementById('fileBtn');

    if (result.rows.length === 0) {
      summaryEl.textContent = 'Nothing meets the $' + result.threshold + ' threshold right now.';
      tableWrap.innerHTML = '<div class="empty">No tenants to file.</div>';
      fileBtn.disabled = true;
    } else {
      summaryEl.textContent = result.rows.length + ' notice(s) will be filed at $' + result.threshold + '+ owed:';
      var rows = result.rows.map(function(r) {
        return '<tr><td>' + r.name + '</td><td>' + r.address + '</td><td class="amount">$' + r.amount + '</td></tr>';
      }).join('');
      tableWrap.innerHTML = '<table><thead><tr><th>Name</th><th>Address</th><th>Amount</th></tr></thead><tbody>' + rows + '</tbody></table>';
      fileBtn.disabled = false;
    }

    document.getElementById('step2').scrollIntoView({ behavior: 'smooth' });
  }

  function fileNow() {
    if (!currentToken) return;
    if (!confirm('This will file real Demand for Possession notices. Continue?')) return;

    var btn = document.getElementById('fileBtn');
    var errEl = document.getElementById('fileError');
    errEl.innerHTML = '';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Filing…';

    google.script.run
      .withSuccessHandler(function(result) {
        document.getElementById('fileResult').innerHTML =
          '<div class="success">✅ Filed ' + result.filed + ' notice(s).' +
          (result.errors > 0 ? ' ' + result.errors + ' failed — check the admin email for details.' : '') +
          '</div>';
        btn.style.display = 'none';
        document.querySelector('#step3 .btn-secondary').textContent = 'Start a new filing';
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Let's File";
        errEl.innerHTML = '<div class="error">' + (err.message || err) + '</div>';
      })
      .webConfirmFiling(currentToken);
  }

  function resetForm() {
    currentToken = null;
    document.getElementById('step2').style.display = 'none';
    document.getElementById('step3').style.display = 'none';
    document.getElementById('fileResult').innerHTML = '';
    document.getElementById('fileError').innerHTML = '';
    document.getElementById('previewError').innerHTML = '';
    var btn = document.getElementById('fileBtn');
    btn.style.display = 'block';
    btn.disabled = false;
    btn.textContent = "Let's File";
  }
</script>
